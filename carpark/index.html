<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Car Park · MB North Dublin</title>
<!--
  Car park map — Mercedes-Benz North Dublin (MSL). Internal tool, v1.
  One self-contained file, no external requests.

  To edit:
    • Layout (rows, bay counts, positions) → "1. SITE LAYOUT" in the script.
    • Cars in bays                          → "2. STOCK" in the script.
      While STOCK is empty the page shows generated demo cars.
    • Fonts: Mercedes-Benz corporate fonts, see fonts/README.md.
  Deep link to a car or bay: …/carpark/#262D99999 or …/carpark/#E07
-->
<style>
  /* Mercedes-Benz corporate typefaces: an installed copy is used first,
     otherwise the files in fonts/ (licensed, so not bundled; see fonts/README.md). */
  @font-face {
    font-family: "MB Corpo S Text"; font-weight: 400; font-style: normal; font-display: swap;
    src: local("MB Corpo S Text"), local("MBCorpoSText-Regular"), local("MB Corpo S Text Office"), local("MBCorpoSTextOffice-Regular"),
         url("fonts/MBCorpoSText-Regular.woff2") format("woff2"), url("fonts/MBCorpoSText-Regular.woff") format("woff"),
         url("fonts/MBCorpoSText-Regular.ttf") format("truetype"), url("fonts/MBCorpoSText-Regular.otf") format("opentype");
  }
  @font-face {
    font-family: "MB Corpo S Text"; font-weight: 700; font-style: normal; font-display: swap;
    src: local("MB Corpo S Text Bold"), local("MBCorpoSText-Bold"), local("MB Corpo S Text Office Bold"), local("MBCorpoSTextOffice-Bold"),
         url("fonts/MBCorpoSText-Bold.woff2") format("woff2"), url("fonts/MBCorpoSText-Bold.woff") format("woff"),
         url("fonts/MBCorpoSText-Bold.ttf") format("truetype"), url("fonts/MBCorpoSText-Bold.otf") format("opentype");
  }
  @font-face {
    font-family: "MB Corpo A Title Cond"; font-weight: 400; font-style: normal; font-display: swap;
    src: local("MB Corpo A Title Cond"), local("MBCorpoATitleCond-Regular"), local("MB Corpo A Title Cond Office"), local("MBCorpoATitleCondOffice-Regular"),
         url("fonts/MBCorpoATitleCond-Regular.woff2") format("woff2"), url("fonts/MBCorpoATitleCond-Regular.woff") format("woff"),
         url("fonts/MBCorpoATitleCond-Regular.ttf") format("truetype"), url("fonts/MBCorpoATitleCond-Regular.otf") format("opentype");
  }
  :root {
    --black: #000;
    --ink: #141414;
    --muted: #6f6f6f;
    --accent: #0078d6;          /* Mercedes-Benz web blue */
    --ground: #e1e6db;          /* grass */
    --paved: #cbced3;           /* dealership car park surface */
    --road: #bfc2c7;
    --building: #24262a;
    --sans: "MB Corpo S Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: "MB Corpo A Title Cond", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh; overflow: hidden;
    font: 14px/1.35 var(--sans); color: var(--ink); background: var(--ground);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }

  /* ── Header ───────────────────────────────────────────── */
  .bar {
    position: relative; z-index: 20;
    display: flex; align-items: center; gap: 10px 24px;
    padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
    padding-top: max(10px, env(safe-area-inset-top));
    background: var(--black); color: #fff;
  }
  .brand small {
    display: block; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: #9b9b9b;
  }
  .brand h1 { margin: 0; font: 400 21px/1.15 var(--serif); white-space: nowrap; }
  .search { position: relative; flex: 1; max-width: 520px; }
  .search input {
    width: 100%; height: 40px; padding: 0 40px 0 38px;
    font: 16px var(--sans); color: #fff; background: #1b1b1b;
    border: 1px solid #3b3b3b; border-radius: 4px; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  .search input::placeholder { color: #8a8a8a; }
  .search input:focus { border-color: var(--accent); background: #212121; }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .ico { position: absolute; left: 11px; top: 11px; width: 18px; height: 18px; color: #8a8a8a; pointer-events: none; }
  .search .clear {
    position: absolute; right: 4px; top: 4px; width: 32px; height: 32px;
    border: 0; background: none; color: #a8a8a8; font-size: 22px; line-height: 1; cursor: pointer;
  }
  .meta { display: flex; align-items: center; gap: 10px; margin-left: auto; font-size: 12px; color: #bdbdbd; white-space: nowrap; }
  .badge {
    padding: 2px 7px; border: 1px solid #5c5c5c; border-radius: 3px;
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #e0e0e0;
  }

  /* search results */
  .results {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px);
    max-height: min(60vh, 440px); overflow-y: auto; overscroll-behavior: contain;
    margin: 0; padding: 4px 0; list-style: none;
    background: #fff; color: var(--ink); border-radius: 4px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .28);
  }
  .results li { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 8px 12px; cursor: pointer; }
  .results li.active { background: #eaf3fc; }
  @media (hover: hover) { .results li:hover { background: #eaf3fc; } }
  .results .r-main { flex: 1; min-width: 0; }
  .results .r-reg { display: block; font-weight: 700; letter-spacing: .02em; }
  .results .r-sub { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .results .r-note { padding: 12px; color: var(--muted); cursor: default; min-height: 0; }
  .pill { flex: none; padding: 2px 7px; border-radius: 3px; background: #efefef; font-weight: 700; font-size: 13px; letter-spacing: .02em; }
  .swatch { flex: none; width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .35); background: #fff; }
  .swatch.empty { border-style: dashed; background: transparent; }

  /* ── Map ──────────────────────────────────────────────── */
  .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--ground); }
  #map {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    cursor: grab;
  }
  #map.dragging { cursor: grabbing; }

  /* surroundings: deliberately muted so the car park stays the focus */
  .grass { fill: var(--ground); }
  .field { fill: #e6e9d8; }
  .trees { fill: #c6d3be; stroke: #c6d3be; stroke-width: 20; stroke-linejoin: round; }
  .tree { fill: #b4c6ac; }
  .hard { fill: #d8dadd; }
  .side-road { fill: var(--road); }
  .nbr { fill: #eeeeec; stroke: #c3c6ca; stroke-width: 6; stroke-linejoin: round; }
  .mway { fill: #b9bdc2; }
  .mway-line { fill: none; stroke: #fff; stroke-width: 1.5; opacity: .85; }
  .mway-line.dash { stroke-dasharray: 30 60; }
  .mway-median { fill: none; stroke: #9a9fa5; stroke-width: 9; }
  .shield rect { fill: #1d5fae; stroke: #fff; stroke-width: 3; }
  .shield text, .road-name {
    font: 700 28px var(--sans); fill: #fff; text-anchor: middle; dominant-baseline: central;
  }
  .road-name { font-weight: 400; font-size: 34px; letter-spacing: 3px; fill: #5c6167; }

  .paved { fill: var(--paved); stroke: #b3b7bc; stroke-width: 3; stroke-linejoin: round; }
  .footway { fill: #e3e4e2; }
  .wall { fill: none; stroke: #8e9399; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
  .verge { fill: #d8e3cd; }                                    /* mown grass */
  .fence { fill: none; stroke: #7b8188; stroke-width: 2; stroke-linejoin: round; }
  .lamp { fill: #5c636b; stroke: #fff; stroke-width: 1.2; }
  .island { fill: #e3e4e2; }                                   /* concrete kerbs */
  .island-edge { fill: none; stroke: #a3a7ac; stroke-width: 2; stroke-linejoin: round; }
  .island-path { fill: url(#brick); }                          /* grey brick footpath */
  .island-bed { fill: #c3d1b9; }
  .flower { stroke: rgba(0, 0, 0, .2); stroke-width: .3; }
  .zebra { fill: #fff; }
  .kerb { fill: #e3e4e2; stroke: #b3b7bc; stroke-width: .5; }
  .bike-shelter { fill: #40464d; }
  .bike-stand { fill: none; stroke: #6f767e; stroke-width: 1.2; stroke-linecap: round; }
  .road-edge { fill: none; stroke: #e9eaeb; }
  .road { fill: none; stroke: var(--road); }
  .road-line { fill: none; stroke: #fff; stroke-width: 1.5; stroke-dasharray: 30 40; opacity: .9; }
  .bld { fill: var(--building); }
  .bld-name { fill: #fff; font: 700 32px var(--sans); letter-spacing: 6px; text-anchor: middle; }
  .bld-sub { fill: #a9abae; font: 400 22px var(--sans); letter-spacing: 6px; text-anchor: middle; }
  .zone { fill: #8b8e92; font: 700 26px var(--sans); letter-spacing: 8px; text-anchor: middle; }

  .bay { cursor: pointer; }
  .bay > rect { fill: transparent; stroke: #fff; stroke-width: 1.2; }
  .bay.unmarked > rect { stroke: #8e9399; stroke-width: .8; stroke-dasharray: 4 3; }   /* room for a car, no painted bay */
  @media (hover: hover) { .bay:hover > rect { fill: rgba(0, 120, 214, .16); } }
  .bay.sel > rect { fill: rgba(0, 120, 214, .22); }
  .bay use { transition: opacity .2s; }
  #map.searching .bay:not(.hit) use { opacity: .25; }
  .hatch { pointer-events: none; }
  .hatch rect { fill: var(--paved); }
  .hatch rect, .hatch path { stroke: #fff; stroke-width: 1.2; }
  #map.searching .bay.hit > rect { fill: rgba(0, 120, 214, .3); }

  /* zoom level 2: bay numbers; level 3: number moves to the inner end + number plates */
  .bay-id, .bay-id2, .plate { display: none; pointer-events: none; }
  #map.z2 .bay-id { display: inline; }
  #map.z3 .bay-id { display: none; }
  #map.z3 .bay-id2, #map.z3 .plate { display: inline; }
  .bay-id, .bay-id2 {
    font: 700 9px var(--sans); fill: #111; text-anchor: middle; dominant-baseline: central;
    paint-order: stroke; stroke: rgba(255, 255, 255, .9); stroke-width: 2.4px; stroke-linejoin: round;
  }
  .bay-id2 { font-size: 6px; stroke-width: 1.6px; }
  .plate rect { fill: #fff; stroke: #111; stroke-width: .4; }
  .plate text { font: 700 4px var(--sans); fill: #111; text-anchor: middle; dominant-baseline: central; }

  .tag circle { fill: #fff; stroke: #111; stroke-width: 1.2; }
  .tag text { font: 700 15px var(--sans); fill: #111; text-anchor: middle; dominant-baseline: central; }

  .sel-box { fill: none; stroke: var(--accent); stroke-width: 3.5; }
  .sel-pulse {
    fill: none; stroke: var(--accent); stroke-width: 3;
    transform-box: fill-box; transform-origin: center;
    animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse { from { transform: scale(.35); opacity: 1; } to { transform: scale(1); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .sel-pulse { animation: none; opacity: .6; } }

  /* overlays */
  .compass {
    position: absolute; left: 12px; top: 12px; width: 40px; height: 40px;
    display: grid; place-items: center; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .25); pointer-events: none;
  }
  .compass svg { width: 26px; height: 26px; }
  .compass text { font: 700 9px var(--sans); fill: #111; text-anchor: middle; }
  .zoom button:disabled { color: #c4c4c4; cursor: default; }
  .zoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; box-shadow: 0 1px 4px rgba(0, 0, 0, .25); border-radius: 4px; overflow: hidden; }
  .zoom button {
    width: 40px; height: 40px; border: 0; border-bottom: 1px solid #e4e4e4; background: #fff;
    font-size: 20px; line-height: 1; cursor: pointer; display: grid; place-items: center;
  }
  .zoom button:last-child { border-bottom: 0; }
  .zoom button:active { background: #eee; }
  .zoom svg { width: 18px; height: 18px; }

  .tip {
    position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none;
    padding: 7px 10px; border-radius: 4px; background: rgba(0, 0, 0, .9); color: #fff;
    font-size: 12.5px; line-height: 1.35; white-space: nowrap;
  }
  .tip b { display: block; font-size: 14px; letter-spacing: .03em; }
  .tip span { color: #c9c9c9; }

  .card {
    position: absolute; z-index: 6; left: 16px; bottom: max(16px, env(safe-area-inset-bottom)); width: 340px;
    padding: 14px 16px; border-radius: 6px; background: #fff;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .22);
  }
  .card-head { display: flex; align-items: center; gap: 12px; padding-right: 28px; }
  .card-head .swatch { width: 22px; height: 22px; }
  .card-reg { font-size: 21px; font-weight: 700; letter-spacing: .03em; }
  .card-sub { color: var(--muted); }
  .card-foot { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #ececec; }
  .card-foot .pill { background: var(--black); color: #fff; font-size: 14px; padding: 3px 9px; }
  .card-zone { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; }
  .card-btn { border: 1px solid #cfcfcf; background: #fff; border-radius: 4px; padding: 6px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .card-btn:active { background: #f0f0f0; }
  .card-x {
    position: absolute; right: 6px; top: 6px; width: 36px; height: 36px;
    border: 0; background: none; color: #8a8a8a; font-size: 24px; line-height: 1; cursor: pointer;
  }

  @media (max-width: 640px) {
    .bar { flex-wrap: wrap; padding-bottom: 12px; }
    .brand h1 { font-size: 18px; }
    .meta { flex-direction: column-reverse; align-items: flex-end; gap: 4px; font-size: 11px; }
    .search { order: 3; flex-basis: 100%; max-width: none; }
    .card { left: 8px; right: 8px; width: auto; bottom: max(8px, env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <small>Mercedes-Benz · MSL</small>
    <h1>North Dublin car park</h1>
  </div>
  <div class="search">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    <input id="q" type="search" placeholder="Find a car: reg, model or bay" aria-label="Find a car by reg, model or bay"
           autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search">
    <button class="clear" id="clear" type="button" aria-label="Clear search" hidden>×</button>
    <ul class="results" id="results" role="listbox" hidden></ul>
  </div>
  <div class="meta">
    <span id="stats"></span>
    <span class="badge" id="demo" hidden>Demo data</span>
  </div>
</header>

<main class="stage" id="stage">
  <svg id="map" role="img" aria-label="Car park map">
    <defs>
      <!-- top-down car, 4.7 m × 1.9 m, front pointing +x (units: 10 per metre) -->
      <g id="car">
        <ellipse cx="9.6" cy="-10.1" rx="1.5" ry="1" stroke="#000" stroke-opacity=".5" stroke-width=".5"/>
        <ellipse cx="9.6" cy="10.1" rx="1.5" ry="1" stroke="#000" stroke-opacity=".5" stroke-width=".5"/>
        <path stroke="#000" stroke-opacity=".55" stroke-width=".6"
              d="M-23.5-6.2C-23.5-8.6-22.2-9.5-19.5-9.5H17C21.5-9.5 23.5-8 23.5-4.5V4.5C23.5 8 21.5 9.5 17 9.5H-19.5C-22.2 9.5-23.5 8.6-23.5 6.2Z"/>
        <path fill="#2b3440"
              d="M12.6-7.8Q14.2 0 12.6 7.8L5.6 6.6Q6.3 0 5.6-6.6ZM-12-6.6Q-12.6 0-12 6.6L-17 7.4Q-18.2 0-17-7.4ZM5-7.7-11.4-7.4V-8.3L4.2-8.7ZM5 7.7-11.4 7.4V8.3L4.2 8.7Z"/>
      </g>
      <!-- EV charging bay road marking, plug and "e": 2 × 0.7 m, reading along +x -->
      <g id="ev-mark" fill="#fff">
        <path d="M-11-2.6h2.2v1.2h-2.2zM-11 1.4h2.2v1.2h-2.2zM-8.8-3.5h3.3a3.5 3.5 0 0 1 0 7h-3.3zM-2-.55h4v1.1h-4z"/>
        <path d="M2 0H8.4A3.2 3.2 0 1 0 7.65 2.06" fill="none" stroke="#fff" stroke-width="1.4"/>
      </g>
      <!-- bicycle sign, 3.4 m wide -->
      <g id="bicycle" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="-10" cy="3" r="7"/><circle cx="10" cy="3" r="7"/>
        <path d="M-10 3H-1L-5.5-6ZM-5.5-6H6.5L-1 3M6.5-6 10 3M6.5-6 5.5-9.5H9M-5.5-6-6.5-9M-9-9H-4"/>
      </g>
      <!-- grey block paving: 0.4 × 0.2 m bricks in running bond -->
      <pattern id="brick" width="8" height="4" patternUnits="userSpaceOnUse">
        <rect width="8" height="4" fill="#b9bcc0"/>
        <path d="M0 1H8M0 3H8M1 1V3M5 1V3M3 3V4M7 3V4M3 0V1M7 0V1" fill="none" stroke="#a4a8ad" stroke-width=".35"/>
      </pattern>
    </defs>
    <g id="world"></g>
  </svg>

  <div class="compass" aria-hidden="true">
    <svg viewBox="0 0 26 26"><text x="13" y="9">N</text><path d="M13 11.5 17 23l-4-2.6L9 23Z" fill="#111"/></svg>
  </div>

  <div class="zoom">
    <button type="button" data-zoom="in" aria-label="Zoom in">+</button>
    <button type="button" data-zoom="out" aria-label="Zoom out">−</button>
    <button type="button" data-zoom="fit" aria-label="Show whole car park">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>

  <div class="tip" id="tip" hidden></div>

  <section class="card" id="card" hidden aria-live="polite">
    <button class="card-x" id="card-close" type="button" aria-label="Close">×</button>
    <div class="card-head">
      <span class="swatch" id="card-swatch"></span>
      <div>
        <div class="card-reg" id="card-reg"></div>
        <div class="card-sub" id="card-sub"></div>
      </div>
    </div>
    <div class="card-foot">
      <span class="pill" id="card-bay"></span>
      <span class="card-zone" id="card-zone"></span>
      <button class="card-btn" id="card-locate" type="button">Centre</button>
    </div>
  </section>
</main>

<script>
(() => {
'use strict';

/* =====================================================================
   1. SITE LAYOUT  (metres; origin = building's north-west corner,
      x grows east, y grows south)
      Traced from the satellite image at roughly 0.2 m per pixel, so it
      is approximate. Adjust bay counts / positions here.
   ===================================================================== */
const BAY_W = 2.5;   // bay width
const BAY_D = 5;     // bay depth

const BUILDING = { x: 0, y: 0, w: 80, h: 70 };

// Rows of bays. Two letters = a double row (two rows back to back), one letter = a single row.
//   dir 'h': runs west→east, bays numbered west→east (reverse: true → east→west)
//   dir 'v': runs north→south, bays numbered north→south (reverse: true → south→north)
//   w / d: bay size along / across the row (default BAY_W × BAY_D)
//   tagGap: [start, end] distance from the row's ends to its letter tags (default 3 m each);
//     [along, across] also moves a tag sideways, null leaves that end without one
// Double rows: rows[0] is the north/west side and faces north/west, rows[1] faces south/east.
// Single rows face `face` ('north', 'south', 'east' or 'west'): the way the cars' fronts point.
// unmarked: true → no painted bays, just room for cars (drawn dashed).
// skip: [n, n] → leave out the first n bays on each side (numbering starts after them).
// ev: [n, n] → the first n bays on each side are EV charging bays.
const ROWS = [
  // outer line along the north edge: 11 bays, A01 ending in line with the front of the east outer
  // line. It sits one bay depth higher than the top of that line; the grass corner above E01 holds
  // the lamp post and the E letter, so A has its letter at the west end only.
  { zone: 'North', rows: ['A'],      dir: 'h', x: 74.5, y: -24.5, bays: 11, face: 'south', reverse: true, tagGap: [3, null] },
  // inner double row, bay for bay opposite E09–E27. At its north end the first 5 bays on the C side
  // are the bike park and the first 6 on the D side are EV charging bays; a stone island closes its
  // south end, and the row letters there sit on its flower bed
  { zone: 'East',  rows: ['C', 'D'], dir: 'v', x: 86,   y: 0.5,   bays: 19, skip: [5, 0], ev: [0, 6], tagGap: [3, 5] },
  { zone: 'East',  rows: ['E'],      dir: 'v', x: 102,  y: -19.5, bays: 29, face: 'west' },    // outer line
  // south side, open space rather than a car park. From the showroom out: a pavement where cars
  // stand parallel to the showroom (F), a two-way road, then cars at right angles to the
  // boundary wall (G)
  { zone: 'South', rows: ['F'],      dir: 'h', x: 1,    y: 70.25, bays: 13, w: 6, d: 2.5, face: 'east', unmarked: true },
  { zone: 'South', rows: ['G'],      dir: 'h', x: 0,    y: 79,    bays: 31, face: 'north', unmarked: true },
];

  const w = dr.w || BAY_W, d = dr.d || BAY_D;
  dr.rows.forEach((row, side) => {
    // (fx, fy) = direction the car's front faces; a double row faces out towards both aisles
    const [fx, fy] = dr.rows.length === 1 ? FACE[dr.face]
      : dr.dir === 'h' ? [0, side ? 1 : -1] : [side ? 1 : -1, 0];
    const skip = (dr.skip || [])[side] || 0, ev = (dr.ev || [])[side] || 0;
    for (let i = skip; i < dr.bays; i++) {
      const k = dr.reverse ? dr.bays - 1 - i : i;          // position along the row
      const b = dr.dir === 'h'
        ? { x: dr.x + k * w, y: dr.y + side * d, w, h: d, fx, fy }
        : { x: dr.x + side * d, y: dr.y + k * w, w: d, h: w, fx, fy };
      b.id = row + String(i - skip + 1).padStart(2, '0');
      b.row = row; b.zone = dr.zone; b.unmarked = !!dr.unmarked; b.ev = i - skip < ev; b.order = bays.length;
      b.cx = b.x + b.w / 2; b.cy = b.y + b.h / 2;

function demoStock() {
  let seed = 0x2620d;
  const rnd = () => {   // mulberry32: same demo cars on every load
    seed = seed + 0x6d2b79f5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const pick = list => {
    let r = rnd() * list.reduce((a, x) => a + x[1], 0);
    for (const x of list) if ((r -= x[1]) < 0) return x[0];
    return list[list.length - 1][0];
  };
  const MODELS = [
    ['A 180', 6], ['A 200 d', 3], ['B 200', 2], ['CLA 200', 3], ['CLA 250+', 3], ['GLA 200', 6], ['EQA 250+', 4],
    ['C 200', 5], ['C 220 d', 7], ['C 300 e', 3], ['CLE 220 d', 2], ['GLB 200 d', 3], ['EQB 250+', 2],
    ['GLC 220 d', 9], ['GLC 300 de', 4], ['E 220 d', 5], ['E 300 e', 3], ['EQE 300', 2], ['EQE SUV 350+', 1],
    ['GLE 300 d', 4], ['GLE 450 d', 2], ['G 450 d', 1], ['S 450 d', 1], ['EQS 450+', 1], ['GLS 450 d', 1],
  ];
  const COLOURS = [['Black', 24], ['Grey', 22], ['White', 14], ['Silver', 12], ['Blue', 10], ['Red', 4], ['Green', 3]];
  const COUNTIES = [['D', 70], ['MH', 6], ['KE', 6], ['WW', 3], ['LH', 3], ['C', 2], ['G', 2], ['WH', 2], ['KK', 1], ['CN', 1], ['LS', 1]];
  const used = new Set(['262D99999']);
  const out = [];
  for (const b of bays) {
    if (b.ev || rnd() > 0.8) continue;                  // EV charging bays stay empty for now
    let reg;
    do {
      const isNew = rnd() < 0.45;
      const year = isNew ? 26 : 15 + Math.floor(rnd() * 11);
      const half = isNew ? (rnd() < 0.75 ? 2 : 1) : (rnd() < 0.5 ? 1 : 2);
      const county = isNew && rnd() < 0.9 ? 'D' : pick(COUNTIES);
      reg = `${year}${half}-${county}-${1 + Math.floor(rnd() * (county === 'D' ? 99999 : 9999))}`;
    } while (used.has(norm(reg)));
    used.add(norm(reg));
    out.push({ bay: b.id, reg, model: pick(MODELS), colour: pick(COLOURS) });
  }
  // the example from the brief
  const ex = { bay: 'E07', reg: '262-D-99999', model: 'GLE 300 d', colour: 'Black' };
  const i = out.findIndex(c => c.bay === ex.bay);
  i >= 0 ? (out[i] = ex) : out.push(ex);
  return out;
}

const svg = $('#map'), world = $('#world');

const pairs = flat => { const p = []; for (let i = 0; i < flat.length; i += 2) p.push([flat[i], flat[i + 1]]); return p; };
const poly = (flat, cls) => `<path class="${cls}" d="M${pairs(flat).map(([x, y]) => `${u(x)} ${u(y)}`).join('L')}Z"/>`;
const inside = ([x, y], flat) => {             // point in polygon (ray casting)
  const p = pairs(flat); let isIn = false;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    const [xi, yi] = p[i], [xj, yj] = p[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) isIn = !isIn;
  }
  return isIn;
};

// convex polygon shrunk by d metres on every side (planted bed inside an island's kerb)
function inset(flat, d) {
  const p = pairs(flat), n = p.length;
  const area = p.reduce((a, [x, y], i) => a + x * p[(i + 1) % n][1] - p[(i + 1) % n][0] * y, 0);
  const lines = p.map(([x0, y0], i) => {                     // each edge moved inwards: point + direction
    const [x1, y1] = p[(i + 1) % n], len = Math.hypot(x1 - x0, y1 - y0), s = area > 0 ? d : -d;
    return [x0 - (y1 - y0) / len * s, y0 + (x1 - x0) / len * s, x1 - x0, y1 - y0];
  });
  return lines.flatMap(([ax, ay, adx, ady], i) => {         // corner = where this edge meets the previous one
    const [bx, by, bdx, bdy] = lines[(i + n - 1) % n], t = ((bx - ax) * bdy - (by - ay) * bdx) / (adx * bdy - ady * bdx);
    return [ax + adx * t, ay + ady * t];
  });
}

// the part of a polygon south (below = true) or north of the line y = y0
function clipY(flat, y0, below) {
  const p = pairs(flat), out = [], keep = y => below ? y >= y0 : y <= y0;
  p.forEach((a, i) => {
    const b = p[(i + 1) % p.length];
    if (keep(a[1])) out.push(a[0], a[1]);
    if ((a[1] - y0) * (b[1] - y0) < 0) out.push(a[0] + (y0 - a[1]) / (b[1] - a[1]) * (b[0] - a[0]), y0);
  });
  return out;
}

// flowers dotted over a bed on a jittered grid (the same on every load)
function flowers(bed) {
  const p = pairs(bed), xs = p.map(q => q[0]), ys = p.map(q => q[1]), safe = inset(bed, 0.35);
  const COLOURS = ['#e2b53a', '#a284c4', '#fbfaf4'];
  let h = '', n = 0;
  for (let y = Math.min(...ys) + 0.6; y < Math.max(...ys); y += 1.1) {
    for (let x = Math.min(...xs) + 0.6; x < Math.max(...xs); x += 1.25, n++) {
      const q = [x + Math.sin(n * 12.99) * 0.35, y + Math.cos(n * 7.23) * 0.3];
      const fill = COLOURS[Math.floor((Math.sin(n * 3.7) + 1) * 1.5) % 3];
      if (inside(q, safe)) h += `<circle class="flower" cx="${u(q[0])}" cy="${u(q[1])}" r="${u(0.24)}" fill="${fill}"/>`;
    }
  }
  return h;
}

// 0.8 m hatched strip (white outline and rungs) on the line between two neighbouring bays
function hatch(a, b) {
  const mx = (a.cx + b.cx) / 2, my = (a.cy + b.cy) / 2, ns = Math.abs(a.cx - b.cx) < 0.01;   // ns: row runs north–south
  const w = ns ? a.w : 0.8, h = ns ? 0.8 : a.h, len = ns ? w : h;
  let d = '';
  for (let s = 0.7; s < len - 0.3; s += 0.7) {
    d += ns ? `M${u(mx - w / 2 + s)} ${u(my - 0.4)}V${u(my + 0.4)}` : `M${u(mx - 0.4)} ${u(my - h / 2 + s)}H${u(mx + 0.4)}`;
  }
  return `<g class="hatch"><rect x="${u(mx - w / 2)}" y="${u(my - h / 2)}" width="${u(w)}" height="${u(h)}"/><path d="${d}"/></g>`;
}

// zebra crossing: 0.5 m white bars every metre along the walking line, 2.6 m wide
function zebra([ax, ay, bx, by]) {
  const len = Math.hypot(bx - ax, by - ay), ux = (bx - ax) / len, uy = (by - ay) / len, nx = -uy * 1.3, ny = ux * 1.3;
  let d = '';
  for (let s = 0.25; s + 0.5 <= len; s += 1) {
    const x0 = ax + ux * s, y0 = ay + uy * s, x1 = x0 + ux * 0.5, y1 = y0 + uy * 0.5;
    d += `M${u(x0 + nx)} ${u(y0 + ny)}L${u(x1 + nx)} ${u(y1 + ny)}L${u(x1 - nx)} ${u(y1 - ny)}L${u(x0 - nx)} ${u(y0 - ny)}Z`;
  }
  return `<path class="zebra" d="${d}"/>`;
}

function smoothPath(pts) {
  let d = `M${u(pts[0][0])} ${u(pts[0][1])}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += `C${u(p1[0] + (p2[0] - p0[0]) / 6)} ${u(p1[1] + (p2[1] - p0[1]) / 6)} ` +
         `${u(p2[0] - (p3[0] - p1[0]) / 6)} ${u(p2[1] - (p3[1] - p1[1]) / 6)} ${u(p2[0])} ${u(p2[1])}`;
  }
  return d;
}

function drawSurroundings() {
  const s = SURROUNDINGS, A = AREA, m = 100;         // grass reaches past the pan limits
  let h = `<rect class="grass" x="${u(A.x0 - m)}" y="${u(A.y0 - m)}" width="${u(A.x1 - A.x0 + 2 * m)}" height="${u(A.y1 - A.y0 + 2 * m)}"/>`;
  h += s.field.map(p => poly(p, 'field')).join('') + s.trees.map(p => poly(p, 'trees')).join('');
  h += s.hard.map(p => poly(p, 'hard')).join('') + s.roads.map(p => poly(p, 'side-road')).join('');

  // M50: carriageways, lane markings, central barrier, shields
  h += poly(s.motorway, 'mway');
  const [x0, y0, x1, y1] = s.median, len = Math.hypot(x1 - x0, y1 - y0);
  const nx = -(y1 - y0) / len, ny = (x1 - x0) / len;                 // unit normal, pointing south
  const at = (x, off) => { const t = (x - x0) / (x1 - x0); return [x0 + t * (x1 - x0) + nx * off, y0 + t * (y1 - y0) + ny * off]; };
  const line = (off, cls) => `<path class="${cls}" d="M${u(x0 + nx * off)} ${u(y0 + ny * off)}L${u(x1 + nx * off)} ${u(y1 + ny * off)}"/>`;
  h += line(0, 'mway-median');
  for (const off of [-18.4, -1.9, 1.9, 15.8]) h += line(off, 'mway-line');
  for (const off of [-12.8, -7.1, 6.4, 11.3]) h += line(off, 'mway-line dash');
  for (const [x, off] of [[-60, -10], [170, 9]]) {
    const [sx, sy] = at(x, off);
    h += `<g class="shield" transform="translate(${u(sx)} ${u(sy)})"><rect x="-45" y="-21" width="90" height="42" rx="8"/><text>M50</text></g>`;
  }
  const [tx, ty] = at(60, -10), ang = (Math.atan2(y1 - y0, x1 - x0) * 180 / Math.PI).toFixed(2);
  h += `<text class="road-name" transform="translate(${u(tx)} ${u(ty)}) rotate(${ang})">Northern Cross Route</text>`;

  // main road + roadside trees (skipping any that fall on our car park)
  const road = smoothPath(pairs(ROAD));
  h += `<path class="road-edge" d="${road}" stroke-width="${u(ROAD_W + 5)}"/>
    <path class="road" d="${road}" stroke-width="${u(ROAD_W)}"/>
    <path class="road-line" d="${road}"/>`;
  h += pairs(s.roadTrees).filter(t => !inside(t, TARMAC)).map(([x, y]) => `<circle class="tree" cx="${u(x)}" cy="${u(y)}" r="${u(2.6)}"/>`).join('');

  return h + s.buildings.map(p => poly(p, 'nbr')).join('');
}

function draw() {
  let h = `<g>${drawSurroundings()}`;
  h += poly(VERGE, 'verge') + poly(TARMAC, 'paved');
  for (const f of FOOTWAYS) h += `<rect class="footway" x="${u(f.x)}" y="${u(f.y)}" width="${u(f.w)}" height="${u(f.h)}"/>`;
  h += `<path class="wall" d="M${pairs(WALL).map(([x, y]) => `${u(x)} ${u(y)}`).join('L')}"/>`;
  h += `<path class="fence" d="M${pairs(FENCE).map(([x, y]) => `${u(x)} ${u(y)}`).join('L')}"/>`;
  for (const [x, y] of LAMPS) h += `<circle class="lamp" cx="${u(x)}" cy="${u(y)}" r="${u(0.45)}"/>`;
  for (const i of ISLANDS) {
    const bed = inset(clipY(i.kerb, i.bedFrom, true), 0.3);
    h += poly(i.kerb, 'island') + poly(clipY(i.kerb, i.bedFrom, false), 'island-path') +
         poly(bed, 'island-bed') + flowers(bed) + poly(i.kerb, 'island-edge');
  }
  for (const c of CROSSINGS) h += zebra(c);
  for (const b of BIKE_PARKS) {
    h += `<rect class="kerb" x="${u(b.x + b.w - 0.15)}" y="${u(b.y)}" width="${u(0.3)}" height="${u(b.h)}"/>`;
    for (let y = b.y + 1.4; y < b.y + b.h - 0.8; y += 1.2) h += `<path class="bike-stand" d="M${u(b.x + 3.7)} ${u(y)}H${u(b.x + 4.5)}"/>`;
    h += `<rect class="bike-shelter" x="${u(b.x + 0.4)}" y="${u(b.y + 0.8)}" width="${u(3)}" height="${u(b.h - 1.6)}" rx="${u(0.3)}"/>` +
         `<use href="#bicycle" transform="translate(${u(b.x + 1.9)} ${u(b.y + b.h / 2)}) scale(.75)"/>`;
  }
  const B = BUILDING, bx = u(B.x + B.w / 2), by = u(B.y + B.h / 2);
  h += `<rect class="bld" x="${u(B.x)}" y="${u(B.y)}" width="${u(B.w)}" height="${u(B.h)}"/>
    <text class="bld-name" x="${bx}" y="${by - 6}">MERCEDES-BENZ</text>
    <text class="bld-sub" x="${bx}" y="${by + 26}">NORTH DUBLIN</text>`;
  for (const l of LABELS) {
    h += `<text class="zone" x="${u(l.x)}" y="${u(l.y)}"${l.rotate ? ` transform="rotate(${l.rotate} ${u(l.x)} ${u(l.y)})"` : ''}>${esc(l.text)}</text>`;
  }
  h += `</g><g id="bays">`;

  for (const b of bays) {
    const c = carAt.get(b.id);
    h += `<g class="bay${b.unmarked ? ' unmarked' : ''}${b.ev ? ' ev' : ''}" data-id="${b.id}"><rect x="${u(b.x)}" y="${u(b.y)}" width="${u(b.w)}" height="${u(b.h)}"/>`;
    if (b.ev) h += `<use href="#ev-mark" transform="translate(${u(b.cx - b.fx * 1.5)} ${u(b.cy - b.fy * 1.5)}) rotate(${b.rot - 90}) scale(.85)"/>`;
    if (c) {
      h += `<use href="#car" fill="${c.hex}" transform="translate(${u(b.cx)} ${u(b.cy)}) rotate(${b.rot}) scale(${c.sx} ${c.sy})"/>`;
      const px = b.cx - b.fx * 0.6, py = b.cy - b.fy * 0.6;       // plate: nudged to the inner end
      const pw = u(c.reg.length * 0.22 + 0.4);
      h += `<g class="plate" transform="translate(${u(px)} ${u(py)})${b.fx === 0 ? ' rotate(-90)' : ''}">` +
           `<rect x="${-pw / 2}" y="-3.5" width="${pw}" height="7" rx="1"/><text>${esc(c.reg)}</text></g>`;
    }
    // bay number: centred (zoom level 2), or at the aisle end next to the plate (level 3)
    h += `<text class="bay-id" x="${u(b.cx)}" y="${u(b.cy)}">${b.id}</text>` +
         `<text class="bay-id2" x="${u(b.cx + b.fx * 1.8)}" y="${u(b.cy + b.fy * 1.8)}">${b.id}</text></g>`;
  }
  h += `</g><g>`;
  for (const [a, b] of HATCHES) h += hatch(bayById.get(a), bayById.get(b));

  // row letters at both ends of every row
  for (const dr of ROWS) {
    const w = dr.w || BAY_W, d = dr.d || BAY_D, len = dr.bays * w;
    const gaps = (dr.tagGap || [3, 3]).map(g => g == null ? null : Array.isArray(g) ? g : [g, 0]);   // [along, across]
    dr.rows.forEach((row, side) => {
      const off = side * d + d / 2, ends = [];
      gaps.forEach((g, end) => {
        if (!g) return;                                     // no letter at this end
        const a = end ? len + g[0] : -g[0];
        ends.push(dr.dir === 'h' ? [dr.x + a, dr.y + off + g[1]] : [dr.x + off + g[1], dr.y + a]);
      });
      for (const [x, y] of ends) {
        h += `<g class="tag"><circle cx="${u(x)}" cy="${u(y)}" r="${u(1.3)}"/><text x="${u(x)}" y="${u(y)}">${row}</text></g>`;
      }
    });
  }
  h += `</g><g id="sel"></g>`;
  world.innerHTML = h;
}
draw();

const bayEls = new Map([...world.querySelectorAll('.bay')].map(el => [el.getAttribute('data-id'), el]));
const selLayer = $('#sel');

/* ---------- header stats ---------- */
$('#stats').textContent = `${carAt.size} cars · ${bays.length - carAt.size} free`;
$('#demo').hidden = !isDemo;

/* =====================================================================
   VIEW: screen = world(m) × k + (x, y)
   ===================================================================== */
const stage = $('#stage');
const view = { k: 1, x: 0, y: 0 };
let W = 0, H = 0, kMin = 1, fitted = true;
const K_MAX = 40;

const xs = pairs(TARMAC).map(p => p[0]), ys = pairs(TARMAC).map(p => p[1]);
const CONTENT = { x0: Math.min(...xs) - 2, y0: Math.min(...ys) - 6, x1: Math.max(...xs) + 6, y1: Math.max(...ys) + 10 };   // + the trees past the south wall
const EXTENT = AREA;

const clampK = k => Math.min(K_MAX, Math.max(kMin, k));

function measure() {
  const r = stage.getBoundingClientRect();
  W = r.width; H = r.height;
  // furthest zoom-out: no wider than the pan area, no taller than MAX_VIEW_H
  kMin = Math.max(W / (EXTENT.x1 - EXTENT.x0), H / MAX_VIEW_H);
}

// whole car park in view (or as close as the zoom-out limit allows)
function fitView() {
  const pad = 20;
  const k = clampK(Math.min((W - pad * 2) / (CONTENT.x1 - CONTENT.x0), (H - pad * 2) / (CONTENT.y1 - CONTENT.y0)));
  return constrain({ k, x: W / 2 - (CONTENT.x0 + CONTENT.x1) / 2 * k, y: H / 2 - (CONTENT.y0 + CONTENT.y1) / 2 * k });
}

// keep the visible area inside EXTENT; on an axis where the screen shows more than the
// extent (e.g. up/down when zoomed out), centre it instead, so that axis can't move
function constrain(v) {
  const vx0 = -v.x / v.k, vx1 = (W - v.x) / v.k, vy0 = -v.y / v.k, vy1 = (H - v.y) / v.k;
  const dx0 = vx0 - EXTENT.x0, dx1 = vx1 - EXTENT.x1, dy0 = vy0 - EXTENT.y0, dy1 = vy1 - EXTENT.y1;
  const sx = dx1 > dx0 ? (dx0 + dx1) / 2 : Math.min(0, dx0) || Math.max(0, dx1);
  const sy = dy1 > dy0 ? (dy0 + dy1) / 2 : Math.min(0, dy0) || Math.max(0, dy1);
  v.x += sx * v.k; v.y += sy * v.k;
  return v;
}

let zoomClass = '';
const zoomIn = $('[data-zoom="in"]'), zoomOut = $('[data-zoom="out"]');
function apply() {
  const s = view.k / S;
  world.setAttribute('transform', `matrix(${s} 0 0 ${s} ${view.x} ${view.y})`);
  zoomIn.disabled = view.k >= K_MAX * 0.999;
  zoomOut.disabled = view.k <= kMin * 1.001;
  const z = view.k >= 22 ? 'z3' : view.k >= 10 ? 'z2' : '';
  if (z !== zoomClass) {
    svg.classList.remove('z2', 'z3');
    if (z === 'z3') svg.classList.add('z2', 'z3');
    else if (z) svg.classList.add(z);
    zoomClass = z;
  }
  sizePulse();
}

function zoomAt(p, f) {
  const k = clampK(view.k * f), r = k / view.k;
  view.x = p.x - (p.x - view.x) * r;
  view.y = p.y - (p.y - view.y) * r;
  view.k = k;
  fitted = false;
  constrain(view); apply();
}

/* smooth zoom+pan path (van Wijk & Nuij, as used by d3-interpolate, ISC licence) */
function zoomPath(p0, p1) {
  const rho = Math.SQRT2, rho2 = 2, rho4 = 4;
  const [ux0, uy0, w0] = p0, [ux1, uy1, w1] = p1, dx = ux1 - ux0, dy = uy1 - uy0, d2 = dx * dx + dy * dy;
  let i, S1;
  if (d2 < 1e-12) {
    S1 = Math.log(w1 / w0) / rho;
    i = t => [ux0 + t * dx, uy0 + t * dy, w0 * Math.exp(rho * t * S1)];
  } else {
    const d1 = Math.sqrt(d2),
      b0 = (w1 * w1 - w0 * w0 + rho4 * d2) / (2 * w0 * rho2 * d1),
      b1 = (w1 * w1 - w0 * w0 - rho4 * d2) / (2 * w1 * rho2 * d1),
      r0 = Math.log(Math.sqrt(b0 * b0 + 1) - b0),
      r1 = Math.log(Math.sqrt(b1 * b1 + 1) - b1);
    S1 = (r1 - r0) / rho;
    i = t => {
      const s = t * S1, c0 = Math.cosh(r0),
        k = w0 / (rho2 * d1) * (c0 * Math.tanh(rho * s + r0) - Math.sinh(r0));
      return [ux0 + k * dx, uy0 + k * dy, w0 * c0 / Math.cosh(rho * s + r0)];
    };
  }
  i.duration = Math.abs(S1) * 1000;
  return i;
}

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
let raf = 0;
const stopFly = () => { if (raf) cancelAnimationFrame(raf); raf = 0; };
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

// animate to a target view {k, x, y}. Interpolates the world point at the
// screen centre, so a resize mid-flight (phone keyboard closing) can't throw it off.
function flyTo(t, ms) {
  stopFly();
  constrain(t);
  const L = Math.max(W, H);
  const p0 = [(W / 2 - view.x) / view.k, (H / 2 - view.y) / view.k, L / view.k];
  const p1 = [(W / 2 - t.x) / t.k, (H / 2 - t.y) / t.k, L / t.k];
  const place = (cx, cy, k) => { view.k = k; view.x = W / 2 - cx * k; view.y = H / 2 - cy * k; apply(); };
  if (reduceMotion.matches) { place(p1[0], p1[1], t.k); return; }
  const path = zoomPath(p0, p1);
  const dur = ms || Math.min(1500, Math.max(450, path.duration));
  const t0 = performance.now();
  const step = now => {
    const s = Math.min(1, (now - t0) / dur);
    if (s >= 1) { place(p1[0], p1[1], t.k); raf = 0; return; }
    const [cx, cy, w] = path(ease(s));
    place(cx, cy, L / w);
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}

function zoomBy(f, p = { x: W / 2, y: H / 2 }) {
  const k = clampK(view.k * f), r = k / view.k;
  fitted = false;
  flyTo({ k, x: p.x - (p.x - view.x) * r, y: p.y - (p.y - view.y) * r }, 280);
}

function showAll() { fitted = true; flyTo(fitView(), 500); }

// space the bottom card covers on phones
const cardCover = () => (!card.hidden && card.offsetWidth > W * 0.8) ? card.offsetHeight + 16 : 0;

function flyToBay(b) {
  const free = H - cardCover();
  let k = Math.min(Math.max(Math.min(W, free) / 32, 12), 24);   // ~32 m across the short side
  k = Math.max(k, Math.min(view.k, K_MAX));                      // don't zoom out if already closer
  fitted = false;
  flyTo({ k, x: W / 2 - b.cx * k, y: free / 2 - b.cy * k });
}

/* =====================================================================
   INPUT: drag to pan, wheel / pinch / double-tap to zoom, tap to select
   ===================================================================== */
const pts = new Map();
let anchor = null, press = null, lastTap = null, lastPointerType = 'mouse';

const local = e => { const r = svg.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
const bayIdOf = el => el && el.closest ? (el.closest('.bay') || { getAttribute: () => null }).getAttribute('data-id') : null;

function reanchor() {
  const p = [...pts.values()];
  if (p.length === 1) anchor = { v: { ...view }, a: p[0] };
  else if (p.length >= 2) anchor = {
    v: { ...view },
    m: { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 },
    d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1,
  };
  else anchor = null;
}

svg.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  lastPointerType = e.pointerType;
  try { svg.setPointerCapture(e.pointerId); } catch (_) {}
  stopFly(); hideTip(); closeResults();
  const p = local(e);
  pts.set(e.pointerId, p);
  press = pts.size === 1 ? { x: p.x, y: p.y, id: bayIdOf(e.target), moved: false } : null;
  reanchor();
});

svg.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) { if (e.pointerType === 'mouse') hover(e); return; }
  const p = local(e);
  pts.set(e.pointerId, p);
  if (press && !press.moved) {
    if (Math.hypot(p.x - press.x, p.y - press.y) < 6) return;   // still a tap
    press.moved = true;
  }
  const list = [...pts.values()];
  if (list.length === 1 && anchor && anchor.a) {
    view.k = anchor.v.k;
    view.x = anchor.v.x + p.x - anchor.a.x;
    view.y = anchor.v.y + p.y - anchor.a.y;
  } else if (list.length >= 2 && anchor && anchor.m) {
    const [a, b] = list, m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const k = clampK(anchor.v.k * Math.hypot(a.x - b.x, a.y - b.y) / anchor.d);
    const wx = (anchor.m.x - anchor.v.x) / anchor.v.k, wy = (anchor.m.y - anchor.v.y) / anchor.v.k;
    view.k = k; view.x = m.x - wx * k; view.y = m.y - wy * k;
  } else return;
  fitted = false;
  svg.classList.add('dragging');
  constrain(view); apply();
});

function pointerEnd(e) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (!pts.size) svg.classList.remove('dragging');
  if (press && !press.moved && e.type === 'pointerup' && !pts.size) {
    const p = local(e);
    const dbl = e.pointerType !== 'mouse' && lastTap && e.timeStamp - lastTap.t < 320 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 30;
    if (dbl) { lastTap = null; zoomBy(2, p); }
    else { lastTap = { t: e.timeStamp, x: p.x, y: p.y }; select(press.id); }
  }
  press = null;
  reanchor();
}
svg.addEventListener('pointerup', pointerEnd);
svg.addEventListener('pointercancel', pointerEnd);
svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTip(); });
svg.addEventListener('dblclick', e => { if (lastPointerType === 'mouse') zoomBy(2, local(e)); });
svg.addEventListener('contextmenu', e => e.preventDefault());
svg.addEventListener('wheel', e => {
  e.preventDefault();
  stopFly(); hideTip();
  const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? H : 1);
  zoomAt(local(e), Math.pow(2, -dy * (e.ctrlKey ? 0.01 : 0.002)));
}, { passive: false });

document.querySelector('.zoom').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const z = btn.getAttribute('data-zoom');
  if (z === 'in') zoomBy(2); else if (z === 'out') zoomBy(0.5); else showAll();
});

/* ---------- hover tooltip (mouse) ---------- */
const tip = $('#tip');
let tipId = null;
function hover(e) {
  const id = bayIdOf(e.target);
  if (!id) return hideTip();
  if (id !== tipId) {
    const c = carAt.get(id);
    tip.innerHTML = c
      ? `<b>${esc(c.reg)}</b>${esc(c.model)}<span> · ${esc(c.colour)}</span><br><span>Bay ${id}${evNote(id)}</span>`
      : `<b>${id}</b><span>Empty bay${evNote(id)}</span>`;
    tipId = id;
  }
  tip.hidden = false;
  const p = local(e), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = p.x + 16, y = p.y + 16;
  if (x + tw > W - 8) x = p.x - tw - 12;
  if (y + th > H - 8) y = p.y - th - 12;
  tip.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
}
function hideTip() { tip.hidden = true; tipId = null; }

/* =====================================================================
   SELECTION + INFO CARD
   ===================================================================== */
const card = $('#card');
let selected = null;

function select(id, { fly = false } = {}) {
  if (selected && bayEls.get(selected)) bayEls.get(selected).classList.remove('sel');
  selected = id && bayById.has(id) ? id : null;
  if (!selected) {
    selLayer.innerHTML = '';
    card.hidden = true;
    setHash('');
    return;
  }
  const b = bayById.get(id), c = carAt.get(id);
  bayEls.get(id).classList.add('sel');
  selLayer.innerHTML =
    `<rect class="sel-box" x="${u(b.x - 0.2)}" y="${u(b.y - 0.2)}" width="${u(b.w + 0.4)}" height="${u(b.h + 0.4)}" rx="${u(0.4)}"/>` +
    `<circle class="sel-pulse" cx="${u(b.cx)}" cy="${u(b.cy)}" r="${u(4)}"/>`;
  sizePulse();

  $('#card-reg').textContent = c ? c.reg : `Bay ${id}`;
  $('#card-sub').textContent = c ? [c.model, c.colour].filter(Boolean).join(' · ') : 'Empty bay';
  const sw = $('#card-swatch');
  sw.style.background = c ? c.hex : '';
  sw.classList.toggle('empty', !c);
  $('#card-bay').textContent = id;
  $('#card-zone').textContent = `${areaName(b)} · row ${b.row}${evNote(id)}`;
  card.hidden = false;
  setHash(c && c.key ? c.key : id);
  if (fly) flyToBay(b);
}

// keep the pulse ring a similar size on screen at any zoom
function sizePulse() {
  const ring = selLayer.firstElementChild && selLayer.lastElementChild;
  if (ring && ring.tagName === 'circle') ring.setAttribute('r', u(Math.max(3.2, 34 / view.k)));
}

$('#card-close').addEventListener('click', () => select(null));
$('#card-locate').addEventListener('click', () => selected && flyToBay(bayById.get(selected)));

function setHash(h) {
  const url = location.pathname + location.search + (h ? '#' + h : '');
  try { history.replaceState(null, '', url); } catch (_) {}
}

/* =====================================================================
   SEARCH
   ===================================================================== */
const q = $('#q'), results = $('#results'), clearBtn = $('#clear');
let hits = [], active = -1;

function search(text) {
  const qn = norm(text);
  if (qn.length < 2) return [];
  const tokens = String(text).toUpperCase().split(/[\s,]+/).map(norm).filter(Boolean);
  const out = [];
  for (const b of bays) {
    const c = carAt.get(b.id);
    const short = b.row + Number(b.id.slice(b.row.length));            // C07 → C7
    let score = 0;
    if (qn === b.id || qn === short) score = 100;
    else if (c && c.key === qn) score = 90;
    else if (c && c.key.startsWith(qn)) score = 70;
    else if (c && c.key.includes(qn)) score = 60;
    else if (c && tokens.every(t => c.key.includes(t) || c.keyModel.includes(t) || c.keyColour.startsWith(t) || t === b.id)) score = 40;
    if (score) out.push({ b, c, score });
  }
  return out.sort((a, z) => z.score - a.score || a.b.order - z.b.order);
}

function runSearch() {
  const text = q.value;
  clearBtn.hidden = !text;
  hits = search(text);
  active = hits.length ? 0 : -1;

  for (const el of bayEls.values()) el.classList.remove('hit');
  for (const h of hits) bayEls.get(h.b.id).classList.add('hit');
  svg.classList.toggle('searching', hits.length > 0);
  renderResults();
}

function renderResults() {
  const text = q.value.trim();
  if (norm(text).length < 2) { closeResults(); return; }
  if (!hits.length) {
    results.innerHTML = `<li class="r-note">No car matches “${esc(text)}”</li>`;
  } else {
    const shown = hits.slice(0, 60);
    results.innerHTML = shown.map((h, i) => {
      const c = h.c;
      return `<li role="option" data-i="${i}"${i === active ? ' class="active" aria-selected="true"' : ''}>` +
        `<span class="swatch${c ? '' : ' empty'}"${c ? ` style="background:${c.hex}"` : ''}></span>` +
        `<span class="r-main"><span class="r-reg">${c ? esc(c.reg) : 'Empty bay'}</span>` +
        `<span class="r-sub">${c ? esc([c.model, c.colour].filter(Boolean).join(' · ')) : esc(areaName(h.b))}</span></span>` +
        `<span class="pill">${h.b.id}</span></li>`;
    }).join('') + (hits.length > shown.length ? `<li class="r-note">+ ${hits.length - shown.length} more, keep typing</li>` : '');
  }
  results.hidden = false;
}

function closeResults() { results.hidden = true; }

function setActive(i) {
  const items = results.querySelectorAll('li[data-i]');
  if (!items.length) return;
  active = (i + items.length) % items.length;
  items.forEach((li, n) => {
    li.classList.toggle('active', n === active);
    li.setAttribute('aria-selected', n === active ? 'true' : 'false');
  });
  items[active].scrollIntoView({ block: 'nearest' });
}

function choose(h) {
  if (!h) return;
  closeResults();
  q.blur();                       // closes the phone keyboard
  select(h.b.id, { fly: true });
}

function clearSearch() {
  q.value = '';
  runSearch();
}

q.addEventListener('input', runSearch);
q.addEventListener('focus', () => { if (hits.length || norm(q.value).length >= 2) renderResults(); });
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
  else if (e.key === 'Enter') { e.preventDefault(); choose(hits[Math.max(active, 0)]); }
  else if (e.key === 'Escape') {
    if (!results.hidden) closeResults(); else clearSearch();
  }
});
results.addEventListener('mousedown', e => e.preventDefault());   // keep focus in the box
results.addEventListener('click', e => {
  const li = e.target.closest('li[data-i]');
  if (li) choose(hits[+li.getAttribute('data-i')]);
});
clearBtn.addEventListener('click', () => { clearSearch(); q.focus(); });
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('.search')) closeResults();
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); }
  else if (e.key === 'Escape' && document.activeElement !== q) select(null);
});

/* ---------- deep links: #262D99999 or #E07 ---------- */
function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return;
  const best = search(h)[0];
  if (best && best.score >= 90) select(best.b.id, { fly: true });
}
window.addEventListener('hashchange', fromHash);

/* ---------- start ---------- */
measure();
Object.assign(view, fitView());
apply();

new ResizeObserver(() => {
  const cx = (W / 2 - view.x) / view.k, cy = (H / 2 - view.y) / view.k;
  measure();
  if (!W || !H) return;
  if (fitted) Object.assign(view, fitView());
  else { view.k = clampK(view.k); view.x = W / 2 - cx * view.k; view.y = H / 2 - cy * view.k; constrain(view); }
  apply();
}).observe(stage);

fromHash();
})();
</script>
</body>
</html>
